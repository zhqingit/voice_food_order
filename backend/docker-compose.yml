services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_template"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/auth_template
      JWT_SECRET: change-me
      REFRESH_TOKEN_PEPPER: change-me-too
      ACCESS_TOKEN_TTL_MINUTES: 10
      REFRESH_TOKEN_TTL_DAYS: 14
      CORS_ORIGINS: "*"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: voxeats
      GOOGLE_CLOUD_LOCATION: us-central1
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
      GEMINI_USE_VERTEX: "true"
      # Live voice pipeline:
      #   false → Gemini API + gemini-3.1-flash-live-preview (better voice, occasional 503s)
      #   true  → Vertex + gemini-live-2.5-flash-native-audio (GA, reliable, flatter voice)
      VOICE_USE_VERTEX: "true"
      # Conversation monitor (QA checker that runs after each bot turn).
      # Paused during testing to reduce Vertex quota pressure. Code stays in
      # place — flip to "true" to re-enable without a rebuild.
      VOICE_MONITOR_ENABLED: "false"
      WEB_RELOAD: "true"
      WEB_WORKERS: "4"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - uploads:/app/uploads
      - /home/qzhang/mydata/myproject/apps/Resto_AI/src/VoxEats/application_default_credentials.json:/gcp/adc.json:ro
    command: ["bash", "-lc", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  store-portal:
    build:
      context: ../store-portal
    environment:
      VITE_API_TARGET: http://api:8000
    ports:
      - "5174:5174"
    depends_on:
      - api
    volumes:
      - ../store-portal/src:/app/src
      - ../store-portal/public:/app/public

volumes:
  pgdata:
  uploads:
