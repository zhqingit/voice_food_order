# Production-safe base. On a laptop, copy docker-compose.override.example.yml
# to docker-compose.override.yml (gitignored); Compose merges it automatically.
#
# Secrets come from backend/.env (gitignored) and are required — compose
# refuses to start without them. See .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_template"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/auth_template
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in backend/.env}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?set REFRESH_TOKEN_PEPPER in backend/.env}
      ACCESS_TOKEN_TTL_MINUTES: 10
      REFRESH_TOKEN_TTL_DAYS: 14
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Stripe keys come from backend/.env (Compose reads it for ${VAR} interpolation).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_CLOUD_PROJECT: voxeats
      GOOGLE_CLOUD_LOCATION: us-central1
      GEMINI_USE_VERTEX: "true"
      # Live voice pipeline:
      #   false → Gemini API + gemini-3.1-flash-live-preview (better voice, occasional 503s)
      #   true  → Vertex + gemini-live-2.5-flash-native-audio (GA, reliable, flatter voice)
      VOICE_USE_VERTEX: "true"
      # Conversation monitor (QA checker that runs after each bot turn).
      # Paused during testing to reduce Vertex quota pressure. Code stays in
      # place — flip to "true" to re-enable without a rebuild.
      VOICE_MONITOR_ENABLED: "false"
      WEB_RELOAD: "false"
      WEB_WORKERS: "1"
    # Only nginx on the same host talks to the API.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
